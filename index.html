<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastard*! - Il gioco dell'inganno</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0f19">

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="wordbank.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  padding:20px;
  background:#0b0f19;
  color:#fff;
  text-align:center;
}
button {
  padding:15px;
  margin:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.card {
  background:#12182b;
  padding:20px;
  border-radius:15px;
  margin:10px;
}
</style>
</head>

<body>

<h1>Bastard*!</h1>

<div id="home">
  <button onclick="createRoom()">Crea partita</button>
  <button onclick="joinRoom()">Entra</button>
</div>

<div id="game" style="display:none;">
  <h2 id="status"></h2>
  <div id="word" style="font-size:24px;margin:20px;"></div>
  <button onclick="nextRound()">Nuovo round</button>
</div>

<script>

let peer, conn;
let isHost = false;
let players = [];
let myName = "Player" + Math.floor(Math.random()*1000);
let usedPairs = [];

// PRENDI COPPIA DAL DATABASE
function getPair() {
  let available = WORD_BANK.filter(p => !usedPairs.includes(p));

  if (available.length === 0) {
    usedPairs = [];
    available = WORD_BANK;
  }

  let pair = available[Math.floor(Math.random()*available.length)];
  usedPairs.push(pair);

  return pair;
}

// CREA PARTITA
function createRoom() {
  isHost = true;

  peer = new Peer();
  peer.on('open', id => {
    alert("Codice stanza: " + id);
  });

  peer.on('connection', c => {
    conn = c;
    conn.on('data', handleData);
  });

  startGame();
}

// ENTRA
function joinRoom() {
  let id = prompt("Inserisci codice stanza");
  peer = new Peer();

  peer.on('open', () => {
    conn = peer.connect(id);
    conn.on('data', handleData);
  });

  startGame();
}

// AVVIA GIOCO
function startGame() {
  document.getElementById("home").style.display = "none";
  document.getElementById("game").style.display = "block";

  nextRound();
}

// NUOVO ROUND
function nextRound() {

  let pair = getPair();

  let isBastard = Math.random() < 0.25;

  let myWord = isBastard ? pair.b : pair.a;

  document.getElementById("status").innerText =
    isBastard ? "SEI IL BASTARDO" : "SEI UN GIOCATORE";

  document.getElementById("word").innerText = myWord;

}

// DATI
function handleData(data) {
  console.log(data);
}

</script>

</body>
</html>
